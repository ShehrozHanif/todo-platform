# CI workflow — build, test, push on every push/PR to master.
# Path filtering (dorny/paths-filter) skips service builds when only the other service changed.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # Detect which services changed to skip unnecessary builds
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'k8s/Dockerfile.backend'
              - 'k8s/Dockerfile'
            frontend:
              - 'frontend/**'
              - 'k8s/Dockerfile.frontend'

  # Always run tests — independent of service file changes
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-groups
      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          BETTER_AUTH_SECRET: "ci-test-secret-32-chars-minimum!!"
          OPENAI_API_KEY: "sk-test-placeholder-not-real"
        run: uv run pytest -v --tb=short --no-cov

  build-backend:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: k8s/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/todo-backend:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/todo-backend:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  build-frontend:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: k8s/frontend/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          build-args: |
            NEXT_PUBLIC_APP_URL=http://todo.136.116.62.248.nip.io
            NEXT_PUBLIC_API_URL=http://todo.136.116.62.248.nip.io
          tags: |
            ghcr.io/${{ env.OWNER }}/todo-frontend:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/todo-frontend:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # Trigger CD only after all build + test jobs succeed on master push
  deploy:
    needs: [test, build-backend, build-frontend]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      always() &&
      needs.test.result == 'success'
    uses: ./.github/workflows/cd.yml
    secrets: inherit
    with:
      image_tag: ${{ github.sha }}
