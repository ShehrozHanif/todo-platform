# [Task]: T013/T014 [From]: specs/phase5-cloud/cloud-deployment/spec.md §FR-009,FR-010
# CD workflow — deploy to GKE cluster via Helm after CI succeeds on master.
# Requires GitHub Secrets: GCP_SA_KEY, GCP_PROJECT_ID, GKE_CLUSTER, GKE_ZONE,
#   DATABASE_URL, FRONTEND_DATABASE_URL, BETTER_AUTH_SECRET, OPENAI_API_KEY

name: CD

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HELM_NAMESPACE: todo-platform

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_ZONE }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Update Helm dependencies (Bitnami Kafka + Redis)
        run: helm dependency update k8s/helm/todo-platform

      - name: Clear stuck deployments
        run: |
          kubectl delete deployment todo-platform-backend \
            -n "$HELM_NAMESPACE" --ignore-not-found
          kubectl delete deployment todo-platform-frontend \
            -n "$HELM_NAMESPACE" --ignore-not-found

      - name: Deploy to GKE
        run: |
          helm upgrade --install todo-platform k8s/helm/todo-platform \
            --namespace "$HELM_NAMESPACE" \
            --create-namespace \
            -f cloud/helm/values-cloud.yaml \
            --set backend.image.tag="${{ inputs.image_tag }}" \
            --set frontend.image.tag="${{ inputs.image_tag }}" \
            --set mcp-server.image.tag="${{ inputs.image_tag }}" \
            --set-string backend.secrets.DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --set-string backend.secrets.BETTER_AUTH_SECRET="${{ secrets.BETTER_AUTH_SECRET }}" \
            --set-string backend.secrets.OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            --set-string frontend.secrets.DATABASE_URL="${{ secrets.FRONTEND_DATABASE_URL }}" \
            --set-string frontend.secrets.BETTER_AUTH_SECRET="${{ secrets.BETTER_AUTH_SECRET }}" \
            --set-string mcp-server.secrets.DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --timeout 8m \
            --wait

      - name: Diagnose on failure
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods -n "$HELM_NAMESPACE" -o wide
          echo "=== Backend pod logs ==="
          kubectl logs -l app.kubernetes.io/name=backend -n "$HELM_NAMESPACE" --tail=80 || true
          echo "=== Backend pod describe ==="
          kubectl describe pod -l app.kubernetes.io/name=backend -n "$HELM_NAMESPACE" || true
          echo "=== Events ==="
          kubectl get events -n "$HELM_NAMESPACE" --sort-by='.lastTimestamp' | tail -20 || true

      - name: Verify rollouts
        run: |
          kubectl rollout status deployment/todo-platform-backend \
            -n "$HELM_NAMESPACE" --timeout=120s
          kubectl rollout status deployment/todo-platform-frontend \
            -n "$HELM_NAMESPACE" --timeout=120s

      - name: Health check
        run: |
          INGRESS_HOST=$(kubectl get ingress todo-platform-ingress \
            -n "$HELM_NAMESPACE" \
            -o jsonpath='{.spec.rules[0].host}' 2>/dev/null || echo "")
          if [ -n "$INGRESS_HOST" ]; then
            curl --fail --retry 5 --retry-delay 10 \
              "https://${INGRESS_HOST}/health" || {
              echo "Health check failed — rolling back"
              helm rollback todo-platform -n "$HELM_NAMESPACE"
              exit 1
            }
          else
            echo "No ingress host found — skipping HTTP health check"
          fi
